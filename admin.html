<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashley's paste and go go announcement</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #fdf5f5; padding: 20px; color: #333; margin: 0; }
        .container { max-width: 650px; margin: 40px auto; background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(123, 17, 19, 0.08); border-top: 8px solid #7b1113; }
        h2 { color: #7b1113; margin-top: 0; font-size: 1.8em; }
        textarea { width: 100%; height: 200px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; margin-bottom: 20px; font-family: inherit; font-size: 14px; box-sizing: border-box; transition: border-color 0.3s; }
        textarea:focus { border-color: #d4af37; outline: none; }
        button.submit-btn { background: linear-gradient(135deg, #e5b73b, #d4af37); color: #5a0c0e; font-size: 1.1em; font-weight: 800; padding: 14px 24px; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; width: 100%; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3); }
        button.submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(212, 175, 55, 0.4); }
        .instructions { background: #fff9e6; border-left: 5px solid #d4af37; padding: 15px; border-radius: 8px; font-size: 0.95em; margin-bottom: 25px; color: #555; }
        
        /* Dropdown Task Manager Styles */
        .task-manager { margin-top: 40px; border-top: 2px dashed #ccc; padding-top: 20px; }
        .subject-group { margin-bottom: 12px; background: white; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .subject-group summary { background: #fafafa; padding: 14px 18px; cursor: pointer; font-weight: bold; color: #7b1113; border-left: 5px solid #7b1113; outline: none; user-select: none; transition: background 0.2s; }
        .subject-group summary:hover { background: #f2f2f2; }
        .subject-tasks { padding: 5px 18px 15px 18px; background: #fff; }
        .admin-task { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #eee; }
        .admin-task:last-child { border-bottom: none; }
        .admin-task-info { flex: 1; padding-right: 15px; }
        .admin-task-info strong { display: block; color: #333; font-size: 0.95em; }
        .admin-task-info span { font-size: 0.85em; color: #888; }
        .delete-btn { background: #ffebee; color: #d32f2f; border: 1px solid #ffcdd2; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.85em;}
        .delete-btn:hover { background: #d32f2f; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✨ Ashley's Paste & Go Go Announcement</h2>
        <div class="instructions">
            <strong>Auto-Format is ON.</strong><br>
            Just paste <b>NEW</b> announcements below. You do not need to re-paste old ones; the system remembers them until they expire!
        </div>
        <textarea id="inputText" placeholder="✍🏻CC 103-&#10;[MONDAY 7/27]&#10;• Submission of Declaration form..."></textarea>
        <button id="submitBtn" class="submit-btn">Send to Class Tracker 🚀</button>
        <p id="status" style="text-align: center; font-weight: bold; margin-top: 15px;"></p>

        <div class="task-manager">
            <h3 style="margin-bottom: 5px; color: #333;">🛠️ Live Activities in Database</h3>
            <p style="font-size: 0.9em; color: #666; margin-top: 0; margin-bottom: 20px;">Click a subject to open it and remove finished or duplicate tasks.</p>
            <div id="liveTasksList">Loading database...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDuU788zHfYaaCDki93QiszJyDgVkfnJQY",
            authDomain: "reminders-df09c.firebaseapp.com",
            projectId: "reminders-df09c",
            storageBucket: "reminders-df09c.firebasestorage.app",
            messagingSenderId: "455632640409",
            appId: "1:455632640409:web:e95b0c7b78ce963ec19b08"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Load tasks and group them by subject dropdowns
        async function loadLiveTasks() {
            const list = document.getElementById('liveTasksList');
            list.innerHTML = 'Loading...';
            try {
                const q = query(collection(db, "deadlines"), orderBy("date", "asc"));
                const snapshot = await getDocs(q);
                list.innerHTML = '';
                
                if (snapshot.empty) {
                    list.innerHTML = '<p style="color: #888;">Database is completely empty.</p>';
                    return;
                }

                // Group the tasks
                const groupedTasks = {};
                snapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    const subject = data.subject || "General";
                    if (!groupedTasks[subject]) groupedTasks[subject] = [];
                    groupedTasks[subject].push({ id: docSnapshot.id, ...data });
                });

                // Create the dropdowns
                for (const subject in groupedTasks) {
                    const details = document.createElement('details');
                    details.className = 'subject-group';
                    
                    const summary = document.createElement('summary');
                    summary.innerHTML = `${subject} <span style="font-weight: normal; color: #666; font-size: 0.9em; float: right;">(${groupedTasks[subject].length} items) ▾</span>`;
                    details.appendChild(summary);

                    const taskContainer = document.createElement('div');
                    taskContainer.className = 'subject-tasks';

                    groupedTasks[subject].forEach(task => {
                        const div = document.createElement('div');
                        div.className = 'admin-task';
                        
                        // Grab a small preview of her bullet points so she knows what it is
                        let previewText = (task.task || "").replace(/</g, "&lt;").substring(0, 50);
                        if(task.task && task.task.length > 50) previewText += "...";

                        div.innerHTML = `
                            <div class="admin-task-info">
                                <strong>Due: ${task.displayDate || task.date}</strong>
                                <span>${previewText}</span>
                            </div>
                        `;
                        const delBtn = document.createElement('button');
                        delBtn.className = 'delete-btn';
                        delBtn.innerText = '❌ Remove';
                        delBtn.onclick = async () => {
                            delBtn.innerText = '...';
                            await deleteDoc(doc(db, "deadlines", task.id));
                            loadLiveTasks(); 
                        };
                        div.appendChild(delBtn);
                        taskContainer.appendChild(div);
                    });
                    
                    details.appendChild(taskContainer);
                    list.appendChild(details);
                }
            } catch (error) {
                list.innerHTML = 'Error loading tasks.';
            }
        }
        
        loadLiveTasks();

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const text = document.getElementById('inputText').value;
            const status = document.getElementById('status');
            
            status.style.color = "#333";
            status.innerText = "Parsing and uploading to database...";
            document.getElementById('submitBtn').disabled = true;

            let tasksToUpload = [];
            let currentSubject = "General";
            let currentDateString = "TBA";
            let currentTaskLines = [];
            
            const pushTask = () => {
                if (currentTaskLines.length > 0) {
                    let standardDate = "9999-12-31"; 
                    let raw = currentDateString.toUpperCase();
                    
                    let slashMatch = raw.match(/(\d{1,2})\/(\d{1,2})/);
                    if (slashMatch) {
                        standardDate = `2026-${slashMatch[1].padStart(2,'0')}-${slashMatch[2].padStart(2,'0')}`;
                    } else {
                        const months = { JAN:'01', FEB:'02', MAR:'03', APR:'04', MAY:'05', JUN:'06', JUL:'07', AUG:'08', SEP:'09', OCT:'10', NOV:'11', DEC:'12' };
                        for (let m in months) {
                            if (raw.includes(m)) {
                                let dayMatch = raw.match(/\d{1,2}/);
                                if (dayMatch) standardDate = `2026-${months[m]}-${dayMatch[0].padStart(2,'0')}`;
                                break;
                            }
                        }
                    }

                    tasksToUpload.push({
                        subject: currentSubject,
                        task: currentTaskLines.join('\n').trim(),
                        date: standardDate, 
                        displayDate: currentDateString 
                    });
                    currentTaskLines = [];
                }
            };

            const lines = text.split('\n');
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                
                if (line.includes('✍🏻')) {
                    pushTask();
                    currentSubject = line.split('✍🏻')[1].replace(/[-:]$/, '').trim(); 
                } else if (line.startsWith('[') && line.includes(']')) {
                    pushTask();
                    currentDateString = line.match(/\[(.*?)\]/)[1].trim(); 
                } else {
                    currentTaskLines.push(line);
                }
            }
            pushTask(); 

            try {
                for (let t of tasksToUpload) {
                    await addDoc(collection(db, "deadlines"), t);
                }
                status.style.color = "green";
                status.innerText = `✅ Successfully uploaded ${tasksToUpload.length} activity blocks!`;
                document.getElementById('inputText').value = ''; 
                loadLiveTasks(); 
            } catch (e) {
                status.style.color = "red";
                status.innerText = "❌ Error: " + e.message;
            }
            document.getElementById('submitBtn').disabled = false;
        });
    </script>
</body>
</html>
